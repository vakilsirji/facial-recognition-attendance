<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Employee</title>
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --primary-dark: #7c3aed; --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --border: rgba(255,255,255,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .card { background: var(--surface); border-radius: 24px; padding: 2.5rem 2rem; width: 100%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border); }
        .card h2 { font-size: 2rem; font-weight: 700; margin-bottom: 2rem; text-align: center; background: linear-gradient(135deg, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.95rem; color: #cbd5e1; }
        .form-control { width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); border-radius: 12px; font-size: 1rem; color: var(--text); transition: all 0.2s; outline: none; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); background: rgba(15, 23, 42, 0.8); }
        .form-control::placeholder { color: #64748b; }
        
        .file-upload { display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 2rem; border: 2px dashed var(--border); border-radius: 16px; background: rgba(15, 23, 42, 0.3); cursor: pointer; transition: all 0.2s; }
        .file-upload:hover { border-color: var(--primary); background: rgba(139, 92, 246, 0.05); }
        .file-upload input[type="file"] { display: none; }
        .file-upload-text { color: var(--text-muted); margin-top: 10px; font-weight: 500; }
        .file-upload-icon { font-size: 2rem; }
        
        .btn { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.4); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        #message { margin-top: 1.5rem; text-align: center; font-weight: 500; padding: 12px; border-radius: 12px; display: none; }
        .msg-success { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); display: block !important; }
        .msg-error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); display: block !important; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Register Employee</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="e.g. Jane Smith" required>
            </div>
            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" class="form-control" id="empId" placeholder="e.g. EMP123" required>
            </div>
            <div class="form-group">
                <label>Reference Photo</label>
                <label class="file-upload">
                    <span class="file-upload-icon">📷</span>
                    <span class="file-upload-text" id="fileText">Tap to choose photo</span>
                    <input type="file" id="photo" accept="image/*" required>
                </label>
            </div>
            <button type="submit" class="btn" id="submitBtn">Register Now</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        const photoInput = document.getElementById('photo');
        const fileText = document.getElementById('fileText');
        
        photoInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                fileText.innerText = '✅ ' + e.target.files[0].name;
                fileText.style.color = '#34d399';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            
            btn.disabled = true;
            btn.innerText = "Processing...";
            msg.className = '';
            
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('emp_id', document.getElementById('empId').value);
            formData.append('file', photoInput.files[0]);

            try {
                const response = await fetch('/register/', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    msg.className = "msg-success";
                    msg.innerText = `✨ ${data.name} registered successfully!`;
                    document.getElementById('registerForm').reset();
                    fileText.innerText = 'Tap to choose photo';
                    fileText.style.color = 'var(--text-muted)';
                } else {
                    msg.className = "msg-error";
                    msg.innerText = `⚠️ ${data.detail}`;
                }
            } catch (err) {
                msg.className = "msg-error";
                msg.innerText = "⚠️ Network Error occurred.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Register Now";
            }
        });
    </script>
</body>
</html>
