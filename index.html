<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Face Attendance</title>
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --success: #10b981; --error: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { background: var(--surface); padding: 2.5rem 2rem; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05); width: 100%; max-width: 420px; text-align: center; }
        h2 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        p { color: var(--text-muted); margin-bottom: 2rem; font-size: 1rem; }
        
        .upload-btn { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 18px; border-radius: 16px; font-size: 1.15rem; font-weight: 600; display: block; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); }
        .upload-btn:active { transform: scale(0.97); }
        input[type="file"] { display: none; }
        
        .preview-container { position: relative; margin-top: 24px; display: none; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1); background: #0f172a; }
        .preview { width: 100%; display: block; border-radius: 18px; aspect-ratio: 3/4; object-fit: cover; }
        
        .submit-btn { background: var(--success); color: white; padding: 18px; width: 100%; border: none; border-radius: 16px; font-size: 1.15rem; font-weight: 600; cursor: pointer; margin-top: 24px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: none; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4); }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:disabled { background: #334155; cursor: not-allowed; transform: none; box-shadow: none; color: #94a3b8; }
        
        #result { margin-top: 24px; font-weight: 600; font-size: 1.1rem; min-height: 28px; transition: all 0.3s ease; padding: 10px; border-radius: 12px; }
        .spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.2); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; margin-right: 12px; vertical-align: -5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .success-bg { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); }
        .error-bg { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <h2>Face Check-In</h2>
        <p>Snap a quick selfie to mark attendance</p>
        
        <form id="attendanceForm">
            <label class="upload-btn" id="cameraLabel">
                <span id="btnText">📸 Open Camera</span>
                <input type="file" id="cameraInput" accept="image/*" capture="user" required>
            </label>
            
            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" class="preview" alt="Preview" />
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">Verify Identity</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('previewContainer');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('attendanceForm');
        const resultDiv = document.getElementById('result');
        const cameraLabel = document.getElementById('cameraLabel');
        const btnText = document.getElementById('btnText');

        cameraInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                imagePreview.src = URL.createObjectURL(file);
                previewContainer.style.display = 'block';
                submitBtn.style.display = 'block';
                cameraLabel.style.background = 'rgba(255,255,255,0.05)';
                cameraLabel.style.boxShadow = 'none';
                cameraLabel.style.border = '1px dashed rgba(255,255,255,0.2)';
                cameraLabel.style.color = 'var(--text-muted)';
                btnText.innerText = '🔄 Retake Photo';
                resultDiv.innerText = '';
                resultDiv.className = '';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            resultDiv.innerHTML = '<span class="spinner"></span> Processing...';
            resultDiv.style.color = "var(--text)";
            resultDiv.className = '';
            submitBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', cameraInput.files[0]);

            try {
                const response = await fetch('/mark_attendance/', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.style.color = "var(--success)";
                    resultDiv.innerText = `✅ Welcome ${data.present_employees.join(', ')}!`;
                    resultDiv.className = 'success-bg';
                    submitBtn.style.display = 'none';
                    cameraLabel.style.display = 'none';
                } else {
                    resultDiv.style.color = "var(--error)";
                    resultDiv.innerText = `❌ ${data.detail || "Verification failed"}`;
                    resultDiv.className = 'error-bg';
                }
            } catch (err) {
                resultDiv.style.color = "var(--error)";
                resultDiv.innerText = "❌ Network Error";
                resultDiv.className = 'error-bg';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
